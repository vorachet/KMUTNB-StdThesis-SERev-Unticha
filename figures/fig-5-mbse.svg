<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="660" viewBox="0 0 1340 660"><rect width="1340" height="660" fill="#FFFFFF"/><rect x="50" y="130" width="230" height="140" fill="#F4F4F4" stroke="#8A8A8A" stroke-width="1.4" stroke-dasharray="7 5"/><text x="165" y="166" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="600"><tspan x="165" dy="0">ผลของแนวทางที่หนึ่ง</tspan></text><text x="165" y="200" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="13" fill="#5C5C5C" text-anchor="middle" font-weight="400"><tspan x="165" dy="0">บันทึกย่อ ข้อเท็จจริง</tspan><tspan x="165" dy="22">และประเด็นที่ตรวจพบ</tspan></text><text x="165" y="300" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="13" fill="#5C5C5C" text-anchor="middle" font-weight="400"><tspan x="165" dy="0">ภาพที่ 4</tspan></text><line x1="286" y1="200" x2="333" y2="200" stroke="#111111" stroke-width="1.8"/><path d="M344 200 L333 206.05 L333 193.95 Z" fill="#111111"/><text x="315" y="232" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="12" fill="#5C5C5C" text-anchor="middle" font-weight="400"><tspan x="315" dy="0">ต่อจาก</tspan></text><rect x="350" y="130" width="290" height="140" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="350" y="130" width="290" height="46" fill="#E6E6E6"/><rect x="350" y="130" width="290" height="140" fill="none" stroke="#3C3C3C" stroke-width="1.4"/><line x1="350" y1="176" x2="640" y2="176" stroke="#3C3C3C" stroke-width="1.4"/><text x="495" y="159" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="17" fill="#111111" text-anchor="middle" font-weight="600"><tspan x="495" dy="0">ศึกษาระเบียบวิธีและเครื่องมือ</tspan></text><text x="495" y="204" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="14" fill="#5C5C5C" text-anchor="middle" font-weight="400"><tspan x="495" dy="0">ARCADIA และ Capella</tspan><tspan x="495" dy="22">ภายใต้คำแนะนำ</tspan><tspan x="495" dy="22">ของอาจารย์ที่ปรึกษา</tspan></text><line x1="646" y1="200" x2="693" y2="200" stroke="#3C3C3C" stroke-width="1.8"/><path d="M704 200 L693 206.05 L693 193.95 Z" fill="#3C3C3C"/><rect x="710" y="130" width="290" height="140" fill="#D9D9D9" stroke="none" stroke-width="0"/><rect x="710" y="130" width="290" height="46" fill="#C2C2C2"/><rect x="710" y="130" width="290" height="140" fill="none" stroke="#111111" stroke-width="2.8"/><line x1="710" y1="176" x2="1000" y2="176" stroke="#111111" stroke-width="2.8"/><text x="855" y="159" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="17" fill="#111111" text-anchor="middle" font-weight="600"><tspan x="855" dy="0">สร้างแบบจำลองสี่ระดับชั้น</tspan></text><text x="855" y="204" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="14" fill="#5C5C5C" text-anchor="middle" font-weight="400"><tspan x="855" dy="0">OA  SA  LA  PA</tspan><tspan x="855" dy="22">พร้อมข้อกำหนด</tspan><tspan x="855" dy="22">และตัววัดทุกตัว</tspan></text><line x1="1006" y1="200" x2="1053" y2="200" stroke="#111111" stroke-width="1.8"/><path d="M1064 200 L1053 206.05 L1053 193.95 Z" fill="#111111"/><rect x="1070" y="130" width="220" height="140" fill="#FFFFFF" stroke="#111111" stroke-width="2.8"/><text x="1180" y="166" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="600"><tspan x="1180" dy="0">ผลลัพธ์ที่ได้</tspan></text><text x="1180" y="200" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="13" fill="#5C5C5C" text-anchor="middle" font-weight="400"><tspan x="1180" dy="0">แผนภาพ เมทริกซ์</tspan><tspan x="1180" dy="22">ตัววัด 16 ตัว</tspan><tspan x="1180" dy="22">และส่วนต่อประสาน</tspan></text><rect x="350" y="346" width="940" height="150" fill="#FFFFFF" stroke="#111111" stroke-width="2.8"/><text x="380" y="382" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="17" fill="#111111" text-anchor="start" font-weight="600"><tspan x="380" dy="0">ทุกผลผลิตมีชื่อเรียกและตำแหน่งจัดเก็บ</tspan></text><text x="380" y="418" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="14" fill="#5C5C5C" text-anchor="start" font-weight="400"><tspan x="380" dy="0">จึงอ้างถึงได้ทีละชิ้น ตรวจรับได้ และส่งต่อให้ผู้รับช่วงงานได้ ซึ่งเป็นสามข้อที่แนวทางที่หนึ่งให้ไม่ได้</tspan></text><text x="380" y="462" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="14" fill="#111111" text-anchor="start" font-weight="400"><tspan x="380" dy="0">คุณค่าเฉพาะตัวมีสามเรื่อง คือเห็นความไม่ครบถ้วนของการเชื่อมโยง รวมต้นทุนทั้งระบบ และเห็นความซ้ำซ้อนของเซ็นเซอร์</tspan></text><line x1="855" y1="276" x2="855" y2="340" stroke="#111111" stroke-width="1.8"/><line x1="50" y1="556" x2="1290" y2="556" stroke="#8A8A8A" stroke-width="1.2"/><text x="50" y="586" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="14" fill="#5C5C5C" text-anchor="start" font-weight="400"><tspan x="50" dy="0">แนวทางที่สองต่อจากแนวทางที่หนึ่ง ไม่ได้แข่งกับแนวทางที่หนึ่ง เพราะข้อมูลเข้าของการสร้างแบบจำลองมาจากเอกสารต้นฉบับทั้งหมด</tspan></text><text x="50" y="616" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="14" fill="#5C5C5C" text-anchor="start" font-weight="400"><tspan x="50" dy="0">ประเด็นที่ตรวจพบ 14 จาก 17 ประเด็นจึงมาจากแนวทางที่หนึ่ง และอีกสามประเด็นมาจากแนวทางนี้</tspan></text></svg>