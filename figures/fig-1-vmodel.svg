size="16" fill="#111111" text-anchor="middle" font-weight="600"><tspan x="1140" dy="0">ตรวจรับกับผู้ใช้</tspan></text><text x="1140" y="168" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="13" fill="#5C5C5C" text-anchor="middle" font-weight="400"><tspan x="1140" dy="0">ตรงกับที่เกษตรกรต้องการหรือไม่</tspan></text><rect x="553" y="648" width="214" height="62" fill="#D9D9D9" stroke="#111111" stroke-width="2.8"/><text x="660" y="674" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="16" fill="#111111" text-anchor="middle" font-weight="600"><tspan x="660" dy="0">การสร้างและประกอบ</tspan></text><text x="660" y="696" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="13" fill="#5C5C5C" text-anchor="middle" font-weight="400"><tspan x="660" dy="0">ต้นแบบที่ส่งมอบจริง</tspan></text><line x1="293" y1="151" x2="1027" y2="151" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="413" y1="283" x2="907" y2="283" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="533" y1="415" x2="787" y2="415" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="653" y1="547" x2="667" y2="547" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="6 5"/><text x="660" y="145" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="14" fill="#5C5C5C" text-anchor="middle" font-weight="400"><tspan x="660" dy="0">แต่ละระดับมีกิจกรรมทวนสอบคู่ของตนเอง</tspan></text><line x1="70" y1="660" x2="70" y2="163" stroke="#111111" stroke-width="2.4"/><path d="M70 150 L77.15 163 L62.85 163 Z" fill="#111111"/><text x="46" y="420" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="15" fill="#111111" font-weight="600" text-anchor="middle" transform="rotate(-90 46 420)">ทิศทางของงานย้อนรอย</text><line x1="30" y1="728" x2="1290" y2="728" stroke="#8A8A8A" stroke-width="1.2"/><text x="30" y="760" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="14" fill="#5C5C5C"