 y="400" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="14" fill="#111111" font-weight="600" text-anchor="middle" transform="rotate(-90 1392 400)">การบรรลุผล</text><line x1="56" y1="676" x2="1304" y2="676" stroke="#8A8A8A" stroke-width="1.2"/><text x="56" y="706" font-family="Niramit,'TH SarabunPSK',Thonburi,sans-serif" font-size="14" fill="#5C5C5C" text-anchor="start" font-weight="400"><tspan x="56" dy="0">ความสัมพันธ์การบรรลุผลถูกเก็บไว้ทั้งสองทิศทาง และแถบเกณฑ์ของตัววัดต้องแคบลงหรือเท่าเดิมเมื่อไล่ลงทีละระดับ แถบที่กว้างขึ้นคือจุดขาดของห่วงโซ่</tspan></text></svg>